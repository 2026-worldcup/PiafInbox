<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Piaf Inbox personnelle</title><link rel="stylesheet" href="./style.css"></head><body><main><header><div><small>VOTRE ESPACE PERSONNEL</small><h1>Piaf Inbox</h1><p>Vos messages, réunis au même endroit.</p></div><button id="logout" hidden>Se déconnecter</button></header><p id="notice" role="status"></p><section id="login"><h2>Bienvenue</h2><p>Connectez-vous à votre espace privé.</p><form id="loginForm"><label>Adresse e-mail<input id="email" type="email" required autocomplete="username"></label><label>Mot de passe<input id="password" type="password" required autocomplete="current-password"></label><button>Se connecter</button></form></section><section id="app" hidden><nav aria-label="Choix de la boîte"><button data-account="versailles">Académie de Versailles</button><button data-account="yahoo">Yahoo</button><button id="refresh">Actualiser</button><button id="compose">Nouveau message</button></nav><div class="folderbar"><label>Dossier <select id="folders"></select></label></div><div class="layout"><section><h2>Boîte de réception</h2><div id="list"></div></section><article id="message"><p>Choisissez un message pour le lire.</p></article></div><form id="editor" hidden><h2>Écrire un message</h2><label>De <select id="from"><option value="versailles">Académie de Versailles</option><option value="yahoo">Yahoo</option></select></label><label>À <input id="to" type="email" required></label><label>Objet <input id="subject" required></label><label>Message <textarea id="body" required rows="9"></textarea></label><label>Pièces jointes <input id="files" type="file" multiple><small>4 Mo au total maximum.</small></label><button>Envoyer</button><button type="button" id="cancel">Annuler</button></form></section></main><script type="module" src="./app.js"></script></body></html>
